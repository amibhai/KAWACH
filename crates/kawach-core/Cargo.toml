[package]
name = "kawach-core"
description = "KAWACH core: secret handling primitives, capability tokens, scope model, and the backend/provider/discovery traits"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Exposes `CommitToken::for_test()` so downstream crates can unit-test provider and
# backend implementations without standing up an audit log. Never enabled by the CLI
# binary, so the production invariant (no mutation without an audited apply) is intact.
test-support = []

[dependencies]
zeroize.workspace = true
subtle.workspace = true
sha2.workspace = true
hmac.workspace = true
serde.workspace = true
thiserror.workspace = true
async-trait.workspace = true
rand.workspace = true
time.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
