[package]
name = "kawach-audit"
description = "KAWACH tamper-evident audit log: hash chain, canonical encoding, signed checkpoints, and verification"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
kawach-core = { path = "../kawach-core" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
zeroize.workspace = true
rand.workspace = true
# Checkpoint signing. Without it the chain detects edits, reordering and insertion but
# an adversary who can rewrite the whole file from genesis produces a self-consistent
# chain. A signature they cannot forge is what closes that. See DESIGN.md 7.3.
ed25519-dalek = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
